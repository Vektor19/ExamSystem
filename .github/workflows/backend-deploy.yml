name: Backend Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore ExamSystem.Backend/ExamSystem.API/ExamSystem.API.csproj

      - name: Build
        run: dotnet build ExamSystem.Backend/ExamSystem.API/ExamSystem.API.csproj --no-restore --configuration Release

      - name: Publish
        run: dotnet publish ExamSystem.Backend/ExamSystem.API/ExamSystem.API.csproj -c Release -o ./publish
      # - name: Apply EF Core Migrations
      #   run: |
      #     dotnet tool install --global dotnet-ef
      #     export PATH="$PATH:$HOME/.dotnet/tools"
      #     dotnet ef database update --project ExamSystem.Backend/ExamSystem.Persistence/ExamSystem.Persistence.csproj --startup-project ExamSystem.Backend/ExamSystem.API/ExamSystem.API.csproj
      #   env:
      #     Database__ConnectionStrings__SqlServer: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
      #     Database__Provider: sqlserver

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: "ExamSystemBackend"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
